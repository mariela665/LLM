<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocompletado </title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <section class="editor-card" aria-label="Editor SQL">
      <header class="card-header">
        <div>
          <p class="eyebrow">LLM</p>
          <h1 class="card-title">SQL</h1>
        </div>
        <span class="card-hint"><kbd>Tab</kbd> para aceptar</span>
      </header>

      <div class="textarea-wrapper">
        <textarea id="editor" spellcheck="false" aria-label="Editor SQL" placeholder="Empieza a escribir SQL aquí..."></textarea>
        <div id="ghostOverlay" aria-hidden="true"></div>
      </div>

      <footer class="editor-footer">
        <span>Las sugerencias aparecen en gris junto al cursor</span>
        <span class="footer-note">Autocompletado </span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
